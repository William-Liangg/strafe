services:
  # FastAPI Backend
  - type: web
    name: strafe-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: strafe-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: strafe-redis
          type: redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: JIRA_BOARD_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO_OWNER
        sync: false
      - key: GITHUB_REPO_NAME
        sync: false
    healthCheckPath: /health

  # Celery Worker
  - type: worker
    name: strafe-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: strafe-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: strafe-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: JIRA_BOARD_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO_OWNER
        sync: false
      - key: GITHUB_REPO_NAME
        sync: false

databases:
  - name: strafe-db
    plan: free
    databaseName: strafe
    user: strafe
